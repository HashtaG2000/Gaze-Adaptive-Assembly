# Pushing a version tag (e.g. `git tag v2.1.0 && git push origin v2.1.0`) builds the Windows app
# with packaging/build.ps1 (tests first, then PyInstaller, then the app's own --check) and attaches
# GazeAdaptiveStudy-<tag>-windows.zip to a GitHub Release. Unzip and run GazeAdaptiveStudy.exe.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # manual test build from the Actions tab (artifact only, no release)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build (tests, PyInstaller, --check, zip)
        shell: pwsh
        run: ./packaging/build.ps1 -Version "${{ github.ref_name }}" -Python python
      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GazeAdaptiveStudy-windows
          path: dist/GazeAdaptiveStudy-*-windows.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GazeAdaptiveStudy-*-windows.zip
          generate_release_notes: true
